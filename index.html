.pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.splitrow{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}.keypad button{height:64px;border-radius:50%;background:var(--surface2);font-size:1.5rem;font-weight:600}.keypad button:active{background:var(--accent-soft)}
.dots-in{display:flex;gap:14px;justify-content:center;margin:20px 0}.dots-in i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}.dots-in i.on{background:var(--accent);border-color:var(--accent)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== SHEETS / DIALOGS / TOAST ===== */
.overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:640px;max-height:92dvh;max-height:92vh;background:var(--surface);border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .28s var(--ease);padding-bottom:var(--sab);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@supports (height:1dvh){.sheet{max-height:92dvh}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-grab{width:40px;height:5px;border-radius:9px;background:var(--border);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:8px 8px 4px 20px;padding-inline:20px 8px;flex:none}.sheet-head h2{flex:1;font-size:var(--t-lg);font-weight:700;min-width:0}
.sheet-body{padding:8px 20px 16px;overflow-y:auto;overscroll-behavior:contain;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:10px 20px 14px;display:flex;gap:10px;border-top:1px solid var(--border);flex:none}.sheet-foot .btn{flex:1}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:86vh}}
.toasts{position:fixed;z-index:200;inset-inline:0;bottom:calc(var(--nav-h) + var(--sab) + 84px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;max-width:440px;font-size:var(--t-sm);font-weight:550;animation:up .25s var(--ease)}
.toast.danger{background:var(--danger);color:#fff}.toast button{color:var(--accent);font-weight:700;padding:4px 6px;min-height:32px}.toast.danger button{color:#fff;text-decoration:underline}
:root[data-theme=dark] .toast button{color:#0B7A63}
@media (min-width:900px){.toasts{bottom:28px}}
.full{position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto;padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 20px)}
.full .inner{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.logo{width:68px;height:68px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:0 auto}.logo svg{width:38px;height:38px}
.steps{display:flex;gap:6px;justify-content:center}.steps i{width:22px;height:5px;border-radius:9px;background:var(--border)}.steps i.on{background:var(--accent)}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--warn-soft);font-size:var(--t-sm);margin:8px 0}
.report{background:#fff;color:#111;border-radius:12px;padding:24px}
@media print{
  :root,:root[data-theme=dark]{--bg:#fff;--surface:#fff;--text:#000;--muted:#444;--border:#bbb;--accent:#0B5F4D;--surface2:#eee}
  .tabs,.topbar,.fab-wrap,#layers,.toasts,.noprint,.banner{display:none!important}
  body{padding:0!important;background:#fff}main#view{padding:0;max-width:none;animation:none}.card,.report{box-shadow:none;border:1px solid #ccc;break-inside:avoid}.priv .amt{filter:none}
  .bar>i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

const Fmt = {

/* =====================================================================

   ===================================================================== */
const Crypt = {
  te: new TextEncoder(), td: new TextDecoder(),

};

/* =====================================================================
   DATABASE — IndexedDB. Optional vault encryption wraps every record.
   ===================================================================== */
const DB = {
  db: null, key: null, memoryOnly: false,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
      const rq = indexedDB.open(CFG.dbName, CFG.schema);
      rq.onupgradeneeded = e => DB.migrate(rq.result, e.oldVersion, rq.transaction);
      rq.onsuccess = () => { DB.db = rq.result; DB.db.onversionchange = () => DB.db.close(); res(); };
      rq.onerror = () => rej(rq.error);
      rq.onblocked = () => rej(new Error('Database blocked by another tab'));
    });
  },
  /** Schema migrations: add a block per version; never edit old ones. */
  migrate(db, old) {
    if (old < 1) {
      for (const s of CFG.stores) {
        const os = db.createObjectStore(s, { keyPath: 'id' });
        if (s === 'transactions') { os.createIndex('ts', 'ts'); os.createIndex('accountId', 'accountId'); os.createIndex('categoryId', 'categoryId'); os.createIndex('fp', 'fp'); }

  },

  async all(store) {

    if (!this.key && !rows.some(r => r._e)) return rows;
    if (!this.key) throw new Error('Vault is locked');
    return Promise.all(rows.map(r => this.unwrap(r)));
  },
  async hasEncrypted() { if (!this.db) return false; for (const s of ['settings', 'accounts']) { const rows = await new Promise(r => { const rq = this.tx(s).objectStore(s).getAll(undefined, 1); rq.onsuccess = () => r(rq.result); rq.onerror = () => r([]); }); if (rows.some(x => x._e)) return true; } return false; },

/* =====================================================================

const S = {

for (const s of CFG.stores) { S.d[s] = []; S.m[s] = new Map(); }
const DEFAULT_SETTINGS = () => ({
  id: 'app', currency: CFG.defaultCurrency, currencies: [CFG.defaultCurrency], rates: {}, startDay: 1,
  salaryOn: false, salaryAmount: 0, salaryDay: 27, defaultAccount: null, storeOriginal: true, largeThreshold: 50000,
  savingsTarget: 0, reserve: 0, stsBills: true, stsSubs: true, stsSavings: true, onboarded: false, demo: false,
  recent: { cats: [], merchants: [], accounts: [], cards: [] }, created: Date.now(),

/** Memoise per data version. */
const memo = (k, fn) => { const hit = S.memo.get(k); if (hit && hit.v === S.ver) return hit.r; const r = fn(); S.memo.set(k, { v: S.ver, r }); return r; };
const bump = () => {
  if (S.txDirty) { S.d.transactions.sort((a, b) => b.ts - a.ts); S.txDirty = false; }
  S.ver++; if (S.memo.size > 200) S.memo.clear();
};
const dbFail = e => { console.warn('DB error', e); if (S.dbOk) { S.dbOk = false; toast(t('Could not save to the database. Export a backup soon.'), { danger: true }); setTimeout(() => S.dbOk = true, 8000); } };
const get = (store, id) => S.m[store].get(id);
function upsertMem(store, rec) {

  if (m.has(rec.id)) { const i = arr.indexOf(m.get(rec.id)); if (i >= 0) arr[i] = rec; else arr.push(rec); } else arr.push(rec);
  m.set(rec.id, rec);

}
function save(store, rec) {
  rec.updatedAt = Date.now(); if (!rec.createdAt) rec.createdAt = rec.updatedAt;
  upsertMem(store, rec); bump();

}
function saveMany(store, recs) {
  const now = Date.now();
  for (const r of recs) { r.updatedAt = now; if (!r.createdAt) r.createdAt = now; upsertMem(store, r); }
  bump(); return DB.putMany(store, recs).catch(dbFail);
}

}
function destroy(store, ids) { ids = [].concat(ids); removeMem(store, ids); bump(); return DB.delMany(store, ids).catch(dbFail); }

function trashRec(store, rec, label) {

  save('trash', entry); destroy(store, rec.id); return entry;
}
function restoreTrash(tid) {
  const e = get('trash', tid); if (!e) return false;
  if (S.m[e.store].has(e.rec.id)) { destroy('trash', tid); return false; }

}
async function loadAll() {
  for (const s of CFG.stores) { const rows = await DB.all(s); S.d[s] = rows; S.m[s] = new Map(rows.map(r => [r.id, r])); }

  const st = S.m.settings.get('app');

  if (!st) save('settings', S.set);
  bump();

}
const saveSettings = () => save('settings', S.set);

/* =====================================================================
   SMART PARSER — rule-based, local, no network. Pure functions (no DOM).
   Extensible through BANKS (detection + optional per-bank fix hooks).
   ===================================================================== */
const Parser = (() => {
  const AD = '٠١٢٣٤٥٦٧٨٩', PD = '۰۱۲۳۴۵۶۷۸۹';
  const normDigits = s => String(s == null ? '' : s).replace(/[٠-٩]/g, d => AD.indexOf(d)).replace(/[۰-۹]/g, d => PD.indexOf(d)).replace(/٫/g, '.').replace(/٬/g, ',');
  const normText = s => normDigits(s).replace(/[‎‏‪-‮⁦-⁩؜]/g, '').replace(/ـ/g, '').replace(/ /g, ' ').replace(/\r\n?/g, '\n').replace(/[ \t]+/g, ' ').replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
  /** Lowercased, diacritics/alef/ya/ta-marbuta-normalised key for keyword matching and Arabic-friendly search. */
  const arKey = s => normText(s).toLowerCase().replace(/[ً-ٰٟ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');

  const AR = '\\u0600-\\u06FF';
  const CUR = '(?:(?<![A-Za-z])(?:SAR|S\\.?R\\.?|Saudi\\s*Riyals?|USD|US\\$|EUR|GBP|AED|KWD|BHD|QAR|OMR|EGP)(?![A-Za-z])|(?<![' + AR + '])(?:ر\\.?\\s?س\\.?|ريال(?:\\s*سعودي)?|ريالات|دولار|درهم)(?![' + AR + '])|[﷼$€£])';
  const NUM = '(\\d{1,3}(?:,\\d{3})+(?:\\.\\d+)?|\\d+,\\d{1,2}(?!\\d)|\\d+(?:\\.\\d+)?)';
  const RE_LAB = new RegExp('(?:المبلغ|مبلغ|بمبلغ|قيمة العملية|قيمه العمليه|القيمة|القيمه|Amount|Amt|Value)\\s*[:：]?\\s*(?:' + CUR + '\\s*)?' + NUM, 'gid');
  const RE_CURNUM = new RegExp('(' + CUR + ')\\s*' + NUM, 'gid');
  const RE_NUMCUR = new RegExp(NUM + '\\s*(' + CUR + ')', 'gid');
  const RE_BARE = /(?<![\d.,])(\d+\.\d{2})(?![\d])/g;
  const RE_ANYCUR = new RegExp(CUR, 'i');
  const RE_BAL_PRE = new RegExp('(?:الرصيد المتاح|الرصيد|رصيدك|رصيد|المتاح|avail\\w*\\.?\\s*bal\\w*\\.?|available|balance|bal\\.?)\\s*[:：\\-]?\\s*(?:' + CUR + ')?\\s*$', 'i');
  const RE_FEE_PRE = new RegExp('(?:رسوم|عمولة|عموله|fees?|commission|vat|ضريبة|ضريبه)\\s*[:：\\-]?\\s*(?:' + CUR + ')?\\s*$', 'i');

  function curCode(s) {
    s = String(s || '');
    if (/\$|usd|دولار/i.test(s)) return 'USD';
    if (/€|eur/i.test(s)) return 'EUR';
    if (/£|gbp/i.test(s)) return 'GBP';
    if (/aed|درهم/i.test(s)) return 'AED';
    const m = s.match(/KWD|BHD|QAR|OMR|EGP/i); if (m) return m[0].toUpperCase();
    return 'SAR';
  }
  function numVal(str) {
    let s = String(str);
    if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
    else if (/,\d{1,2}$/.test(s)) s = s.replace(',', '.');
    return s;
  }
  function toMinor(s) {
    const m = String(s).match(/^(\d+)(?:\.(\d*))?$/); if (!m) return NaN;
    const frac = (m[2] || '').padEnd(2, '0');
    let minor = parseInt(m[1], 10) * 100 + parseInt(frac.slice(0, 2), 10);
    if (frac.length > 2 && parseInt(frac[2], 10) >= 5) minor++;
    return minor;
  }
  const blank = (s, i, len) => s.slice(0, i) + ' '.repeat(len) + s.slice(i + len);

  /* ---------- masking of non-amount numbers ---------- */
  function maskNoise(t) {
    let m = t;
    const wipe = (re, grp) => { let x; re.lastIndex = 0; const src = m; while ((x = re.exec(src))) { const [a, b] = grp && x.indices ? x.indices[grp] : [x.index, x.index + x[0].length]; m = blank(m, a, b - a); if (x[0].length === 0) re.lastIndex++; } };
    wipe(/(?:ref(?:erence)?\.?(?:\s*(?:no|number|num|#))?\.?|رقم\s*المرجع|المرجع|مرجع|رقم\s*العملية|رقم\s*الحوالة|trx\s*(?:id|no)?|txn\s*(?:id|no)?|auth(?:orization)?(?:\s*code)?|رمز\s*التفويض)\s*[:：#-]?\s*[A-Za-z0-9][A-Za-z0-9\-]{3,}/gid);
    wipe(/(?:card|بطاق[ةه]\w*|ending(?:\s*(?:in|with))?|ends?\s*(?:in|with)|منتهي[ةه]\s*ب\w*|last\s*4(?:\s*digits)?|account|acct|حساب)[^\d\n]{0,18}?(\d{4})(?!\d)/gid, 1);
    wipe(/(?:\*{2,}|[xX•●·]{2,})\s*\d+/gd);
    wipe(/\bSA\d{2}[\dA-Z ]{18,}/gd);
    wipe(/(?<![\d.])\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{1,4}(?![\d])/gd);
    wipe(/(?<!\d)\d{1,2}[\s\-\/.]*(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?[\s\-\/,.]*\d{2,4}(?!\d)/gid);
    wipe(/(?<!\d)(?:\d{1,2}:\d{2}(?::\d{2})?)(?:\s*(?:[AP]M|ص|م)(?![A-Za-z؀-ۿ]))?/gid);
    wipe(/(?<![\d.])(?:\+?966|00966|0)?5\d{8}(?!\d)/gd);
    wipe(/(?<![\d.,])\d{9,}(?![\d.])/gd);
    return m;
  }

  /* ---------- amount ---------- */
  function findAmounts(masked) {
    const map = new Map();
    const rank = { lab: 3, cur: 2, bare: 1 };
    const add = (start, end, numStr, cls, cur) => {
      const val = toMinor(numVal(numStr)); if (!(val >= 0)) return;
      const prev = map.get(start);
      if (prev && rank[prev.cls] >= rank[cls]) { if (!prev.cur && cur) prev.cur = cur; return; }
      const pre = masked.slice(Math.max(0, start - 30), start); const line = pre.slice(pre.lastIndexOf('\n') + 1);
      map.set(start, { val, start, end, cls, cur, bal: RE_BAL_PRE.test(line), fee: RE_FEE_PRE.test(line) });
    };
    let m;
    RE_LAB.lastIndex = 0; while ((m = RE_LAB.exec(masked))) { const [a, b] = m.indices[1]; const c = masked.slice(m.index, m.index + m[0].length + 6).match(RE_ANYCUR); add(a, b, m[1], 'lab', c ? curCode(c[0]) : null); }
    RE_CURNUM.lastIndex = 0; while ((m = RE_CURNUM.exec(masked))) { const [a, b] = m.indices[2]; add(a, b, m[2], 'cur', curCode(m[1])); }
    RE_NUMCUR.lastIndex = 0; while ((m = RE_NUMCUR.exec(masked))) { const [a, b] = m.indices[1]; add(a, b, m[1], 'cur', curCode(m[2])); }
    RE_BARE.lastIndex = 0; while ((m = RE_BARE.exec(masked))) add(m.index, m.index + m[1].length, m[1], 'bare', null);
    return [...map.values()].sort((a, b) => a.start - b.start);
  }

  /* ---------- dates & times ---------- */
  const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const AMON = { 'يناير': 1, 'فبراير': 2, 'مارس': 3, 'ابريل': 4, 'أبريل': 4, 'مايو': 5, 'يونيو': 6, 'يوليو': 7, 'اغسطس': 8, 'أغسطس': 8, 'سبتمبر': 9, 'اكتوبر': 10, 'أكتوبر': 10, 'نوفمبر': 11, 'ديسمبر': 12 };
  const validYMD = (y, m, d) => { if (y < 1990 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return false; const dt = new Date(y, m - 1, d); return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d; };
  const yy = s => s.length === 2 ? 2000 + parseInt(s, 10) : parseInt(s, 10);
  function findDate(t) {
    let m, hijri = false;
    const re1 = /(?<!\d)(20\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?!\d)/g;
    while ((m = re1.exec(t))) if (validYMD(+m[1], +m[2], +m[3])) return { y: +m[1], m: +m[2], d: +m[3] };
    const re2 = /(?<![\d.])(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})(?!\d)/g;
    while ((m = re2.exec(t))) {
      const a = +m[1], b = +m[2], y = yy(m[3]);
      if (m[3].length === 4 && y >= 1300 && y <= 1500) { hijri = true; continue; }
      if (validYMD(y, b, a)) return { y, m: b, d: a };
      if (validYMD(y, a, b)) return { y, m: a, d: b };
    }
    const mons = 'jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec';
    const re3 = new RegExp('(?<!\\d)(\\d{1,2})[\\s\\-\\/.]*(' + mons + ')[a-z]*\\.?[\\s\\-\\/,.]*(\\d{4}|\\d{2})(?!\\d)', 'gi');
    while ((m = re3.exec(t))) { const mo = MON[m[2].toLowerCase()], y = yy(m[3]); if (validYMD(y, mo, +m[1])) return { y, m: mo, d: +m[1] }; }
    const re4 = new RegExp('(' + mons + ')[a-z]*\\.?\\s*(\\d{1,2})(?:st|nd|rd|th)?,?\\s*(\\d{4})', 'gi');
    while ((m = re4.exec(t))) { const mo = MON[m[1].toLowerCase()]; if (validYMD(+m[3], mo, +m[2])) return { y: +m[3], m: mo, d: +m[2] }; }
    const re5 = new RegExp('(\\d{1,2})\\s*(' + Object.keys(AMON).join('|') + ')\\s*(\\d{4})', 'g');
    while ((m = re5.exec(t))) if (validYMD(+m[3], AMON[m[2]], +m[1])) return { y: +m[3], m: AMON[m[2]], d: +m[1] };
    return hijri ? { hijri: true } : null;
  }
  function findTime(t) {
    const m = t.match(/(?<!\d)([01]?\d|2[0-3]):([0-5]\d)(?::([0-5]\d))?(?:\s*(AM|PM|a\.m\.|p\.m\.|ص|م)(?![A-Za-z؀-ۿ]))?/i);
    if (!m) return null;
    let h = +m[1]; const ap = (m[4] || '').toLowerCase();
    if (/^(pm|p\.m\.|م)$/.test(ap) && h < 12) h += 12;
    if (/^(am|a\.m\.|ص)$/.test(ap) && h === 12) h = 0;
    return { h, mi: +m[2], s: +(m[3] || 0) };
  }

  /* ---------- classification ---------- */
  const has = (k, re) => re.test(k);
  function classify(t) {
    const k = arKey(t);
    const f = {
      reversal: has(k, /عكس|reversal|reversed|الغاء عمليه|\bvoid(ed)?\b|\breverse/),
      refund: has(k, /استرداد|مسترد|\brefund|ارجاع|رد مبلغ|returned purchase/),
      salary: has(k, /راتب|رواتب|salary|payroll|wages/),
      cardPay: has(k, /سداد (بطاقه|ائتمان)|سداد مستحقات بطاقه|credit card payment|card payment|payment to card/),
      sadad: has(k, /سداد|sadad|فاتوره|bill pay/),
      utility: has(k, /كهرباء|الكهرباء|مياه|المياه|electricity|\bwater\b|\bnwc\b|saudi electric|\bsec\b|غاز/),
      recharge: has(k, /شحن|recharge|top ?-?up|topup/) && has(k, /جوال|رصيد|mobile|stc|mobily|zain|sawa|سوا|موبايلي|زين|فيرجن|virgin|lebara|ليبارا/),
      wallet: has(k, /محفظه|wallet/) && has(k, /شحن|top ?-?up|topup|تعبئه/),
      atm: has(k, /سحب نقدي|\bسحب|\batm\b|cash withdrawal|withdraw|صراف/),
      deposit: has(k, /ايداع نقدي|cash deposit|\bcdm\b|ايداع|\bdeposit/),
      tIn: has(k, /حواله وارده|تحويل وارد|حواله واردة|incoming|received|استلام|تم استلام|credited|وارد/),
      tOut: has(k, /حواله صادره|تحويل صادر|outgoing|transfer to|\bsent\b|صادر/),
      transfer: has(k, /حواله|تحويل|transfer|\bsarie\b|سريع/),
      fee: has(k, /رسوم|عمولة|عموله|\bfees?\b|commission|ضريبه القيمه|\bvat\b/),
      sub: has(k, /apple\.com\/bill|itunes|subscription|اشتراك|netflix|spotify|youtube premium|shahid|شاهد/),
      applepay: has(k, /apple ?pay|ابل ?باي|ابل pay/),
      contactless: has(k, /contactless|\bnfc\b|لا تلامسي|تلامسي|tap to pay/),
      online: has(k, /online|الكترونيه|الكتروني|انترنت|e-?commerce|internet|موقع|متجر الكتروني/),
      pos: has(k, /شراء|purchase|\bpos\b|نقاط البيع|\bpaid\b|payment|مدفوعات|\bpay\b|دفع|spent|عمليه/),
      debit: has(k, /\bمدين\b|\bdebit(ed)?\b/),
      credit: has(k, /\bدائن\b|\bcredit(ed)?\b/),
      cardWord: has(k, /ائتمان|credit card|visa|master|ماستر|فيزا/),
      mada: has(k, /\bمدى\b|\bmada\b|debit card/),
      otp: has(k, /رمز التحقق|otp|verification code|رمز التفعيل|كلمه المرور|one.time/),
    };
    let type, dir, strong = true;
    const purchaseWord = f.pos || f.applepay || f.contactless || f.online;
    if (f.reversal) { type = 'reversal'; dir = 'reversal'; }
    else if (f.refund) { type = 'refund'; dir = 'refund'; }
    else if (f.salary) { type = 'salary'; dir = 'income'; }
    else if (f.cardPay) { type = 'card_payment'; dir = 'expense'; }
    else if (f.wallet) { type = 'wallet_topup'; dir = 'expense'; }
    else if (f.recharge) { type = 'recharge'; dir = 'expense'; }
    else if (f.sadad && f.utility) { type = 'utility'; dir = 'expense'; }
    else if (f.sadad) { type = 'sadad'; dir = 'expense'; }
    else if (f.atm && !f.tIn) { type = 'atm'; dir = 'expense'; }
    else if (f.transfer && f.tIn && !f.tOut) { type = 'transfer_in'; dir = 'income'; }
    else if (f.transfer) { type = (f.tIn && !f.tOut) ? 'transfer_in' : 'transfer_out'; dir = type === 'transfer_in' ? 'income' : 'expense'; if (!f.tOut && !f.tIn) strong = false; }
    else if (f.deposit) { type = 'deposit'; dir = 'income'; }
    else if (f.fee && !purchaseWord) { type = /بطاق|card/.test(k) ? 'card_fee' : 'bank_fee'; dir = 'expense'; }
    else if (f.sub && purchaseWord !== false && !f.applepay) { type = 'subscription'; dir = 'expense'; }
    else if (f.applepay) { type = 'applepay'; dir = 'expense'; }
    else if (f.contactless) { type = 'contactless'; dir = 'expense'; }
    else if (f.online) { type = 'online'; dir = 'expense'; }
    else if (f.pos) { type = 'pos'; dir = 'expense'; }
    else if (f.credit && !f.debit) { type = 'deposit'; dir = 'income'; strong = false; }
    else { type = 'other'; dir = 'expense'; strong = false; }
    let method = 'other';
    if (f.applepay) method = 'applepay';
    else if (/^transfer|salary|deposit$/.test(type) || type === 'transfer_in' || type === 'transfer_out') method = 'transfer';
    else if (f.cardWord) method = 'credit';
    else if (f.mada || /pos|contactless|atm|online/.test(type)) method = 'debit';
    if (type === 'online' && !f.cardWord && !f.mada) method = 'online';
    const channel = ({ pos: 'POS', applepay: 'Apple Pay', contactless: 'Contactless', online: 'Online', atm: 'ATM', sadad: 'SADAD', utility: 'SADAD', transfer_in: 'Transfer', transfer_out: 'Transfer', salary: 'Transfer' })[type] || '';
    return { type, dir, strong, method, channel, otp: f.otp };
  }

  /* ---------- merchant ---------- */
  const STOP = '(?=\\s+(?:using|on\\b|with\\b|via\\b|card\\b|ending\\b|date\\b|dated\\b|ref\\b|reference\\b|bal\\b|balance\\b|avail\\w*|time\\b|for\\b|SAR\\b|SR\\b|USD\\b|بتاريخ|بطاقة|البطاقة|عبر|بمبلغ|المبلغ|الرصيد|التاريخ|في\\s+\\d|مرجع|رقم|بواسطة|باستخدام|\\d{1,2}[\\/\\-.]\\d{1,2}[\\/\\-.]\\d{2,4}|\\d{1,2}:\\d{2})|[\\n;،]|\\.\\s|\\.$|,\\s|$)';
  const M_LABELED = new RegExp('(?:لدى|التاجر|اسم التاجر|المتجر|الجهة|الجهه|المستفيد|Merchant(?:\\s*Name)?|Beneficiary|Store|Vendor|Description|الوصف|وصف|اسم المستفيد)\\s*[:：]\\s*([^\\n]+)', 'i');
  const M_INLINE = [
    new RegExp('(?<![' + AR + '])(?:لدى|عند|من عند)\\s+([^\\n]+?)' + STOP, 'i'),
    new RegExp('(?:\\bat|@)\\s+([^\\n]+?)' + STOP, 'i'),
    new RegExp('(?:paid|payment|pay)\\b[^\\n]*?\\bto\\s+([^\\n]+?)' + STOP, 'i'),
    new RegExp('(?:purchase|bought|spent|refund\\w*|reversal|reversed)\\b[^\\n]*?\\bfrom\\s+([^\\n]+?)' + STOP, 'i'),
    new RegExp('(?<![' + AR + '])من\\s+([A-Za-z' + AR + '][^\\n]*?)' + STOP),
  ];
  const T_PARTY = new RegExp('(?:(?<![' + AR + '])(?:من|إلى|الى|الي)(?![' + AR + '])|\\bfrom\\b|\\bto\\b)\\s*[:：]?\\s*([^\\n]+?)' + STOP, 'i');
  function cleanMerchant(s) {
    s = String(s || '').replace(/^[\s:：\-*,.،]+|[\s:：\-*,.،]+$/g, '');
    s = s.replace(/\s*(?:بتاريخ|date|dated|ref|reference|المرجع)\b.*$/i, '').replace(/\s*[‎‏]/g, '');
    if (/^[\d\s.,:*xX\/\-]*$/.test(s) || RE_ANYCUR.test(s) && s.length < 5) return '';
    if (/^(?:your|حسابك|بطاقتك|account|card)\b/i.test(s)) return '';
    return s.slice(0, 60).trim();
  }
  function findMerchant(t, type) {
    const isT = /transfer|salary|deposit/.test(type);
    let m = t.match(M_LABELED);
    if (m) { const c = cleanMerchant(trimAtStop(m[1])); if (c) return { v: c, c: 'high' }; }
    if (isT) { m = t.match(T_PARTY); if (m) { const c = cleanMerchant(m[1]); if (c) return { v: c, c: 'medium' }; } return { v: '', c: 'low' }; }
    for (let i = 0; i < M_INLINE.length; i++) { m = t.match(M_INLINE[i]); if (m) { const c = cleanMerchant(m[1]); if (c) return { v: c, c: i === 4 ? 'medium' : 'high' }; } }
    return { v: '', c: 'low' };
  }
  function trimAtStop(s) { const m = s.match(new RegExp('^(.*?)' + STOP, 'i')); return m ? m[1] : s; }

  /* ---------- banks (extensible) ---------- */
  const BANKS = [
    { id: 'alrajhi', name: 'Al Rajhi', re: /الراجحي|al\s*-?rajhi|alrajhi/i },
    { id: 'snb', name: 'SNB', re: /الأهلي|الاهلي|\bsnb\b|alahli|al\s*ahli|saudi national/i },
    { id: 'riyad', name: 'Riyad Bank', re: /بنك الرياض|riyad\s*bank|riyadbank/i },
    { id: 'alinma', name: 'Alinma', re: /الإنماء|الانماء|alinma/i },
    { id: 'sab', name: 'Saudi Awwal Bank', re: /بنك الأول|بنك الاول|saudi awwal|awwal bank|\bsab\b|ساب/i },
    { id: 'baj', name: 'Bank AlJazira', re: /الجزيرة|الجزيره|aljazira|bank\s*aljazira/i },
    { id: 'bsf', name: 'Banque Saudi Fransi', re: /الفرنسي|fransi|\bbsf\b/i },
    { id: 'anb', name: 'Arab National Bank', re: /العربي الوطني|arab national|\banb\b/i },
    { id: 'stc', name: 'STC Bank', re: /stc\s*bank|stc\s*pay|اس تي سي|stcpay/i,
      fix(r, t) { if (!r.merchant) { const m = t.match(/paid[^\n]*?\bto\s+([^\n]+?)(?:\s+(?:on|using|with)\b|[\n.]|$)/i); if (m) { r.merchant = cleanMerchant(m[1]); r.conf.merchant = 'medium'; } } } },
    { id: 'wallet', name: 'Digital wallet', re: /urpay|ur\s*pay|mobily\s*pay|barq|d360|enjaz/i },
  ];
  const detectBank = t => { const b = BANKS.find(b => b.re.test(t)); return b || null; };

  /* ---------- single message ---------- */
  const FIN_WORD = /شراء|حوالة|حواله|سحب|ايداع|إيداع|راتب|استرداد|سداد|purchase|transfer|withdraw|deposit|salary|refund|payment|paid|debit|credit|apple ?pay|مدى|بطاقة|card|عملية|عمليه|رسوم|fee/i;
  function parseOne(raw, ctx) {
    ctx = ctx || {}; const now = ctx.now || new Date();
    const t = normText(raw).trim();
    const cls = classify(t);
    const masked = maskNoise(t);
    const cands = findAmounts(masked);
    const pool = cands.filter(c => !c.bal && !c.fee);
    let chosen = pool.sort((a, b) => (b.cls === 'lab') - (a.cls === 'lab') || a.start - b.start)[0];
    if (!chosen) { const fc = cands.find(c => c.fee && !c.bal); if (fc) { chosen = fc; cls.type = /بطاق|card/i.test(t) ? 'card_fee' : 'bank_fee'; cls.dir = 'expense'; cls.strong = true; cls.channel = ''; cls.method = 'other'; } }
    const issues = []; const conf = {};

    if (S.set.stsSavings && S.set.savingsTarget > 0) { const saved = sum(S.d.goals, g => sum((g.contribs || []).filter(c => c.ts >= p.start && c.ts < p.end), c => c.amount)); savings = Math.max(0, S.set.savingsTarget - saved); }

/* ---------- recurring-pattern suggestions (user must confirm) ---------- */
function suggestRecurring() {
  return memo('sugg', () => {
    const groups = new Map(); const since = Date.now() - 400 * 864e5;
    for (const x of S.d.transactions) { if (x.ts < since) break; if (x.direction !== 'expense' || !x.merchant || x.subId || x.recurringId) continue; const k = mKey(x.merchant); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); }
    const out = []; const dismissed = S.set.dismissed || [];
    const known = new Set([...S.d.subscriptions, ...S.d.recurring].map(s => mKey(s.name)));
    for (const [k, list] of groups) {
      if (list.length < 3 || known.has(k) || dismissed.includes(k)) continue;
      const sorted = list.slice().sort((a, b) => a.ts - b.ts); const gaps = []; for (let i = 1; i < sorted.length; i++) gaps.push(daysBetween(sorted[i - 1].ts, sorted[i].ts));
      const med = gaps.slice().sort((a, b) => a - b)[gaps.length >> 1];
      const freq = med >= 26 && med <= 35 ? 'monthly' : med >= 6 && med <= 8 ? 'weekly' : med >= 355 && med <= 375 ? 'yearly' : null;
      if (!freq) continue;
      const amts = sorted.map(x => x.amount); const avg = sum(amts) / amts.length;
      if (amts.some(a => Math.abs(a - avg) / avg > 0.25)) continue;
      const last = sorted[sorted.length - 1];
      out.push({ key: k, merchant: last.merchant, amount: last.amount, currency: last.currency, freq, count: sorted.length, last: last.ts, categoryId: last.categoryId, accountId: last.accountId });
    }
    return out.slice(0, 5);
  });
}

/* ---------- insights (deterministic statistics, not AI) ---------- */
function buildInsights() {
  return memo('ins|' + P.lang + '|' + S.ui.periodOffset, () => {
    const out = []; const p = periodAt(S.ui.periodOffset || 0), pp = periodShift(p, -1);
    const a = aggregate(p.start, Math.min(p.end, Date.now() + 864e5)), b = aggregate(pp.start, pp.end);
    if (!a.count && !b.count) return out;
    const nowTs = Math.min(Date.now(), p.end - 1); const elapsed = Math.max(1, daysBetween(p.start, nowTs) + 1);
    // category movement vs same elapsed span previous period
    const bCmp = aggregate(pp.start, Math.min(pp.end, pp.start + elapsed * 864e5));
    const movers = [];
    for (const [c, v] of a.byCat) { const prev = bCmp.byCat.get(c) || 0; if (prev > 5000 && v > 0) { const ch = (v - prev) / prev; if (Math.abs(ch) >= 0.1) movers.push([c, ch, v]); } }
    movers.sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]));
    for (const [c, ch] of movers.slice(0, 2)) out.push({ icon: ch > 0 ? 'up' : 'down', tone: ch > 0 ? 'warn' : 'good', text: ch > 0 ? t('You spent {p} more on {c} than at this point last period.', { p: Fmt.pct(ch), c: catLabel(c) }) : t('Your {c} spending is {p} lower than at this point last period.', { c: catLabel(c), p: Fmt.pct(-ch) }) });
    const subs7 = upcoming(startOfDay(Date.now()), addDays(Date.now(), 7)).filter(u => u.kind === 'sub');
    if (subs7.length) out.push({ icon: 'repeat', tone: 'info', text: t('{n} subscription(s) will renew during the next 7 days.', { n: Fmt.n(subs7.length) }) });
    const all = aggregate(addDays(Date.now(), -120), Date.now() + 864e5);
    if (all.spendCount >= 14) { let bi = 0; all.wd.forEach((v, i) => { if (v > all.wd[bi]) bi = i; }); out.push({ icon: 'calendar', tone: 'info', text: t('{d} is your highest-spending day.', { d: Fmt.df({ weekday: 'long' }).format(new Date(2024, 0, 7 + bi)) }) }); }
    for (const bg of S.d.budgets) { const i = budgetInfo(bg, p); if (i.pct >= 0.8 && bg.amount > 0) out.push({ icon: 'alert', tone: i.pct >= 1 ? 'bad' : 'warn', text: i.pct >= 1 ? t('You have exceeded your {c} budget ({p}).', { c: bg.categoryId ? catLabel(bg.categoryId) : t('total'), p: Fmt.pct(i.pct) }) : t('You have used {p} of your {c} budget.', { p: Fmt.pct(i.pct), c: bg.categoryId ? catLabel(bg.categoryId) : t('total') }) }); }
    if (a.spendCount) out.push({ icon: 'chart', tone: 'info', text: t('Your average daily spending this period is {a}.', { a: Fmt.money(Math.round(a.spend / elapsed)) }) });
    if (a.income > 0) { const sr = (a.income - a.spend) / a.income; out.push({ icon: 'savings', tone: sr >= 0.1 ? 'good' : 'warn', text: sr >= 0 ? t('You kept {p} of your income this period.', { p: Fmt.pct(sr) }) : t('You spent more than you earned this period.') }); }
    const big = a.txs.filter(x => x.direction === 'expense' && toBase(x.amount, x.currency) >= S.set.largeThreshold).length;
    if (big && S.set.largeThreshold > 0) out.push({ icon: 'bolt', tone: 'info', text: t('{n} large transaction(s) above {a} this period.', { n: Fmt.n(big), a: Fmt.money(S.set.largeThreshold) }) });
    if (!S.d.budgets.length) out.push({ icon: 'target', tone: 'info', text: t('Set a monthly budget to see how much you can still spend each day.') });
    return out.slice(0, 7);
  });
}

/* ---------- financial health (informational only) ---------- */
function healthSummary() {
  const p = periodAt(0); const a = aggregate(p.start, p.end);
  const tb = totalBudget(); const bi = tb ? budgetInfo(tb, p) : null;
  const sr = a.income > 0 ? (a.income - a.spend) / a.income : null;
  const months = [1, 2, 3].map(i => { const q = periodShift(p, -i); return aggregate(q.start, q.end).spend; }).filter(v => v > 0);
  let stability = null; if (months.length >= 2) { const avg = sum(months) / months.length; const sd = Math.sqrt(sum(months, v => (v - avg) ** 2) / months.length); stability = 1 - Math.min(1, sd / avg); }
  const st = safeToSpend();
  return { budgetUse: bi ? bi.pct : null, savingsRate: sr, stability, commitments: st.bills + st.subs, available: st.available };
}

let lastAct = { el: null, t: 0 };
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const now = Date.now(); if (lastAct.el === el && now - lastAct.t < 280) { e.preventDefault(); return; } lastAct = { el, t: now };
  const fn = Acts[el.dataset.act]; if (!fn) { console.warn('No action', el.dataset.act); return; }
  try { const r = fn(el, e); if (r && r.catch) r.catch(uiErr); } catch (err) { uiErr(err); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && Acts[el.dataset.in]) { try { Acts[el.dataset.in](el, e); } catch (err) { uiErr(err); } } });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && Acts[el.dataset.ch]) { try { const r = Acts[el.dataset.ch](el, e); if (r && r.catch) r.catch(uiErr); } catch (err) { uiErr(err); } } });
function uiErr(err) { console.error(err); toast(t('Something went wrong. Your data is safe — please try again.'), { danger: true }); }

/* ---------- toasts ---------- */
function toast(msg, o) {
  o = o || {}; const box = $('#toasts'); const el = document.createElement('div'); el.className = 'toast' + (o.danger ? ' danger' : '');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (o.action ? '<button type="button">' + esc(o.action.label) + '</button>' : '');
  if (o.action) el.querySelector('button').onclick = () => { try { o.action.fn(); } catch (e) { uiErr(e); } el.remove(); };
  while (box.children.length >= 3) box.firstChild.remove();
  box.appendChild(el); setTimeout(() => el.remove(), o.ms || (o.action ? 6000 : 3200));
}

/* ---------- sheets ---------- */
const Sheet = {
  stack: [],
  open(o) {
    const ov = document.createElement('div'); ov.className = 'overlay';
    const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
    const layer = { el: sh, ov, opts: o, prevFocus: document.activeElement };
    sh.innerHTML = '<div class="sheet-grab"></div><div class="sheet-head"><h2></h2><button class="icon-btn" type="button" data-act="sheet-close" aria-label="' + esc(t('Close')) + '">' + ic('close') + '</button></div><div class="sheet-body"></div>' + '<div class="sheet-foot hide"></div>';
    layer.setTitle = x => { sh.querySelector('h2').textContent = x; sh.setAttribute('aria-label', x); };
    layer.setBody = h => { sh.querySelector('.sheet-body').innerHTML = h; };
    layer.setFoot = h => { const f = sh.querySelector('.sheet-foot'); f.innerHTML = h || ''; f.classList.toggle('hide', !h); };
    layer.body = () => sh.querySelector('.sheet-body');
    layer.close = r => Sheet.close(layer, r);
    layer.setTitle(o.title || ''); layer.setBody(o.body || ''); layer.setFoot(o.foot || '');
    ov.appendChild(sh); $('#layers').appendChild(ov);
    ov.addEventListener('mousedown', e => { if (e.target === ov && !o.persist) layer.close(); });
    this.stack.push(layer); document.body.style.overflow = 'hidden';
    if (o.onMount) o.onMount(layer);
    if (o.focus) { const f = $(o.focus, sh); if (f) setTimeout(() => f.focus(), 60); }
    return layer;
  },
  close(layer, r) {
    layer = layer || this.stack[this.stack.length - 1]; if (!layer || layer.closed) return; layer.closed = true;
    this.stack = this.stack.filter(l => l !== layer); layer.ov.remove();
    if (!this.stack.length) document.body.style.overflow = '';
    if (layer.opts.onClose) layer.opts.onClose(r);
    try { if (layer.prevFocus && layer.prevFocus.focus && document.contains(layer.prevFocus)) layer.prevFocus.focus({ preventScroll: true }); } catch (e) { /* element gone */ }
  },
  closeAll() { while (this.stack.length) this.close(); },
};
Acts['sheet-close'] = el => { const ov = el.closest('.overlay'); const l = Sheet.stack.find(x => x.ov === ov); Sheet.close(l); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Sheet.stack.length) { const top = Sheet.stack[Sheet.stack.length - 1]; if (!top.opts.persist) Sheet.close(top); } if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); Acts['quick-menu'](); } });

/** Promise-based confirm. opts.type = word the user must type to enable the button. */
function confirmDlg(o) {
  return new Promise(res => {
    let decided = false;
    const layer = Sheet.open({
      title: o.title, persist: false,
      body: '<div class="stack"><p>' + esc(o.msg || '') + '</p>' + (o.type ? '<div class="field"><label>' + esc(t('Type {w} to confirm', { w: o.type })) + '</label><input class="input" id="cf_in" autocomplete="off" dir="auto"></div>' : '') + '</div>',
      foot: '<button class="btn sec" type="button" data-cf="0">' + esc(o.cancel || t('Cancel')) + '</button><button class="btn ' + (o.danger ? 'danger' : '') + '" type="button" data-cf="1" ' + (o.type ? 'disabled' : '') + '>' + esc(o.ok || t('Confirm')) + '</button>',
      onMount(l) {
        const ok = l.el.querySelector('[data-cf="1"]'); const inp = l.el.querySelector('#cf_in');
        if (inp) inp.addEventListener('input', () => { ok.disabled = inp.value.trim().toLowerCase() !== o.type.toLowerCase(); });
        l.el.querySelectorAll('[data-cf]').forEach(b => b.onclick = () => { decided = true; res(b.dataset.cf === '1'); l.close(); });
      },

    });

}

  else if (ty === 'number') ctl = '<input class="input num" id="' + id + '" name="' + f.k + '" inputmode="' + (f.dec ? 'decimal' : 'numeric') + '" dir="ltr" value="' + (val == null || Number.isNaN(val) ? '' : val) + '"' + ph + ' autocomplete="off">';

function formBody(fields, v) { return '<div class="stack">' + fields.filter(f => !f.show || f.show(v)).map(f => fieldHtml(f, v)).join('') + '</div><datalist id="dl_merchants">' + merchantNames().slice(0, 60).map(m => '<option value="' + esc(m) + '">').join('') + '</datalist>'; }
function readForm(root, fields, v) {
  const out = Object.assign({}, v);
  for (const f of fields) {
    if (f.show && !f.show(out)) continue; const ty = f.type || 'text';
    const wrap = root.querySelector('[data-k="' + f.k + '"]'); if (!wrap) continue;
    const inp = wrap.querySelector('[name="' + f.k + '"]');
    if (ty === 'toggle') out[f.k] = wrap.querySelector('.switch').classList.contains('on');
    else if (ty === 'color') { const o = wrap.querySelector('button.on'); out[f.k] = o ? o.dataset.c : null; }
    else if (ty === 'cat') out[f.k] = wrap.dataset.value !== undefined ? (wrap.dataset.value || null) : (out[f.k] || null);
    else if (ty === 'info') continue;
    else if (ty === 'money') out[f.k] = inp.value.trim() === '' ? null : parseMoney(inp.value, f.neg);
    else if (ty === 'number') { const s = Parser.normDigits(inp.value).trim(); out[f.k] = s === '' ? null : Number(s); }
    else if (ty === 'date') out[f.k] = inp.value ? fromInput(inp.value + 'T12:00') : null;
    else if (ty === 'datetime') out[f.k] = inp.value ? fromInput(inp.value) : null;

function validateForm(root, fields, v) {

    const eb = wrap.querySelector('.errmsg'); const x = v[f.k]; let msg = '';
    const empty = x == null || x === '';
    if (f.req && empty) msg = t('This field is required.');
    else if (!empty && (f.type === 'money') && (Number.isNaN(x) || (x < 0 && !f.neg) || (!f.zero && !f.neg && x === 0))) msg = t('Enter a valid amount.');
    else if (!empty && f.type === 'number' && Number.isNaN(x)) msg = t('Enter a valid number.');
    else if (!empty && f.type === 'number' && ((f.min != null && x < f.min) || (f.max != null && x > f.max))) msg = t('Value out of range.');
    else if (f.type === 'money' && Number.isNaN(x) && !empty) msg = t('Enter a valid amount.');
    else if (!empty && (f.type === 'date' || f.type === 'datetime') && !Number.isFinite(x)) msg = t('Enter a valid date.');

/**
 * Generic add/edit sheet.
 * cfg: {title, fields, values, save(values)->bool|void|Promise, onDelete, saveLabel}
 */
function formSheet(cfg) {
  let v = Object.assign({}, cfg.values || {});
  const layer = Sheet.open({
    title: cfg.title, body: '', persist: !!cfg.persist,
    foot: (cfg.onDelete ? '<button class="btn dangerline" type="button" data-fs="del" style="flex:0 0 auto" aria-label="' + esc(t('Delete')) + '">' + ic('trash') + '</button>' : '') + (cfg.secondary ? '<button class="btn sec" type="button" data-fs="sec">' + esc(cfg.secondary.label) + '</button>' : '') + '<button class="btn" type="button" data-fs="save">' + esc(cfg.saveLabel || t('Save')) + '</button>',
    onMount(l) {
      const draw = () => { const cur = readForm(l.el, cfg.fields, v); v = cur; keepCat(l); l.setBody(formBody(cfg.fields, v)); restoreCat(l); };
      let cats = {}; const keepCat = l => { l.el.querySelectorAll('[data-k][data-value]').forEach(w => cats[w.dataset.k] = w.dataset.value); };
      const restoreCat = l => { l.el.querySelectorAll('[data-k]').forEach(w => { if (cats[w.dataset.k] !== undefined) w.dataset.value = cats[w.dataset.k]; }); };
      l.setBody(formBody(cfg.fields, v));
      l.el.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.reload) draw(); });
      l.el.addEventListener('reload', draw);
      l.el.addEventListener('catchange', e => { if (cfg.onCat) cfg.onCat(e.detail, v); });

        const cur = readForm(l.el, cfg.fields, v);
        if (!validateForm(l.el, cfg.fields, cur)) { const bad = l.el.querySelector('.errmsg:not(.hide)'); if (bad) bad.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
        this.disabled = true;
        try { const r = await cfg.save(cur); if (r !== false) l.close(); } catch (err) { uiErr(err); } finally { this.disabled = false; }
      };
      const sc = l.el.querySelector('[data-fs="sec"]'); if (sc) sc.onclick = async () => { await cfg.secondary.fn(); l.close(); };
      const d = l.el.querySelector('[data-fs="del"]'); if (d) d.onclick = async () => { if (await confirmDlg({ title: t('Delete?'), msg: cfg.deleteMsg || t('This item will be moved to Trash.'), ok: t('Delete'), danger: true })) { await cfg.onDelete(); l.close(); } };
    },
    focus: cfg.focus,
  });
  return layer;
}

/* ---------- pickers ---------- */
const Pickers = {
  category(o) {
    o = o || {};
    return new Promise(res => {
      let done = false;
      const finish = v => { if (done) return; done = true; res(v); };
      const recent = (S.set.recent.cats || []).map(cat).filter(Boolean).slice(0, 6);
      const render = q => {
        const key = Parser.arKey(q || ''); const list = catsSorted(o.kind);
        const match = c => !key || Parser.arKey(catPath(c.id)).includes(key);
        const tops = list.filter(c => !c.parentId || !cat(c.parentId));
        let h = '';
        for (const c of tops) {
          const kids = list.filter(k => k.parentId === c.id);
          const show = [c, ...kids].filter(match); if (!show.length) continue;
          for (const x of show) h += '<button type="button" class="row tap" data-pc="' + esc(x.id) + '" style="' + (x.parentId ? 'padding-inline-start:44px;min-height:52px' : '') + '">' + catIc(x, true) + '<div class="main"><div class="t">' + esc(catName(x)) + '</div></div>' + (o.selected === x.id ? ic('check', 'sm') : '') + '</button>';
        }
        return h || '<div class="empty"><p>' + esc(t('No matching category.')) + '</p></div>';
      };
      Sheet.open({
        title: t('Choose category'), onClose: () => finish(undefined),
        body: '<div class="stack"><div class="search">' + ic('search', 'sm') + '<input class="input" id="pc_q" placeholder="' + esc(t('Search categories')) + '" autocomplete="off"></div>' +
          (recent.length ? '<div class="chips">' + recent.map(c => '<button type="button" class="chip" data-pc="' + esc(c.id) + '"><span class="sw" style="--c:' + esc(c.color) + '"></span>' + esc(catName(c)) + '</button>').join('') + '</div>' : '') +
          '<div class="card pad0 list" id="pc_list">' + render('') + '</div>' + (o.allowNone ? '<button type="button" class="btn sec" data-pc="">' + esc(t('No category')) + '</button>' : '') + '</div>',
        onMount(l) {
          l.el.addEventListener('click', e => { const b = e.target.closest('[data-pc]'); if (!b) return; finish(b.dataset.pc); l.close(); });
          l.el.querySelector('#pc_q').addEventListener('input', debounce(e => { l.el.querySelector('#pc_list').innerHTML = render(e.target.value); }, 80));
        },
      });
    });
  },
  /** Generic single-choice list sheet. items: [{v,label,sub,icon,color}] */
  choice(title, items, selected) {
    return new Promise(res => {
      let done = false; const fin = v => { if (!done) { done = true; res(v); } };
      Sheet.open({
        title, onClose: () => fin(undefined),
        body: '<div class="card pad0 list">' + items.map(i => '<button type="button" class="row tap" data-cv="' + esc(i.v) + '">' + (i.icon ? iconBox(i.icon, i.color, true) : '') + '<div class="main"><div class="t">' + esc(i.label) + '</div>' + (i.sub ? '<div class="s">' + esc(i.sub) + '</div>' : '') + '</div>' + (String(i.v) === String(selected) ? ic('check', 'sm') : '') + '</button>').join('') + '</div>',
        onMount(l) { l.el.addEventListener('click', e => { const b = e.target.closest('[data-cv]'); if (b) { fin(b.dataset.cv); l.close(); } }); },
      });
    });
  },

/* ---------- charts (SVG / CSS, theme-aware via CSS variables) ---------- */
const Charts = {
  donut(items, o) {
    o = o || {}; const total = sum(items, i => i.value); if (total <= 0) return '';
    const R = 48, C = 2 * Math.PI * R; let off = 0; let segs = '';
    for (const it of items) { const len = it.value / total * C; segs += '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="' + esc(it.color) + '" stroke-width="16" stroke-dasharray="' + Math.max(0, len - (items.length > 1 ? 1.5 : 0)).toFixed(2) + ' ' + (C - len + (items.length > 1 ? 1.5 : 0)).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 60 60)"><title>' + esc(it.label) + '</title></circle>'; off += len; }
    return '<div class="chartbox" style="position:relative;width:' + (o.size || 150) + 'px;height:' + (o.size || 150) + 'px;flex:none"><svg viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="' + esc(o.label || '') + '"><circle cx="60" cy="60" r="' + R + '" fill="none" stroke="var(--surface2)" stroke-width="16"/>' + segs + '</svg><div class="pie-center">' + (o.center || '') + '</div></div>';
  },
  line(points, o) {
    o = o || {}; if (points.length < 2) return ''; const W = 300, H = o.h || 110, pad = 6; const max = Math.max(1, ...points.map(p => p.y)); const sx = (W - 2 * pad) / (points.length - 1);
    const pts = points.map((p, i) => [pad + i * sx, H - pad - (p.y / max) * (H - 2 * pad)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const col = o.color || 'var(--accent)';
    return '<div class="chartbox" style="direction:ltr"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="none" role="img" aria-label="' + esc(o.label || '') + '"><path d="' + d + ' L' + (W - pad) + ' ' + (H - pad) + ' L' + pad + ' ' + (H - pad) + ' Z" fill="' + col + '" opacity=".12"/><path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="hstack between xs muted"><span>' + esc(points[0].x) + '</span><span>' + esc(points[points.length - 1].x) + '</span></div></div>';
  },
  /** Grouped columns: data [{l,a,b}] a=income, b=expense */

/* ---------- cash flow ---------- */
Views.cashflow = () => {
  const mode = S.ui.cfm || 'month'; const now = Date.now(); let buckets = [];
  if (mode === 'week') { const s0 = addDays(startOfDay(now), -new Date(now).getDay()); for (let i = 11; i >= 0; i--) { const s = addDays(s0, -7 * i); buckets.push({ s, e: addDays(s, 7), l: Fmt.date(s, 'dm') }); } }
  else if (mode === 'year') { const y = new Date().getFullYear(); for (let i = 4; i >= 0; i--) buckets.push({ s: new Date(y - i, 0, 1).getTime(), e: new Date(y - i + 1, 0, 1).getTime(), l: String(y - i) }); }
  else if (mode === 'custom') { const c = S.ui.icustom || { from: addDays(now, -60), to: now }; const f = startOfDay(c.from), e = startOfDay(c.to) + 864e5; const span = daysBetween(f, e); const step = span > 180 ? 30 : span > 42 ? 7 : 1; for (let s = f; s < e && buckets.length < 60; s = addDays(s, step)) buckets.push({ s, e: Math.min(e, addDays(s, step)), l: Fmt.date(s, 'dm') }); }
  else buckets = periodsIn(periodShift(periodAt(0), -11).start, periodAt(0).end, 12).map(p => ({ s: p.start, e: p.end, l: pShort(p) }));
  const rows = buckets.map(b => { const g = aggregate(b.s, b.e); return { l: b.l, a: g.income, b: g.spend, n: g.net }; });
  const ti = sum(rows, r => r.a), te = sum(rows, r => r.b);
  let h = '<div class="stack lg"><div class="seg">' + [['week', 'Weekly'], ['month', 'Monthly'], ['year', 'Yearly'], ['custom', 'Custom']].map(m => '<button class="' + (mode === m[0] ? 'on' : '') + '" data-act="cfm" data-k="' + m[0] + '">' + esc(t(m[1])) + '</button>').join('') + '</div>';
  if (mode === 'custom') { const c = S.ui.icustom || { from: addDays(now, -60), to: now }; h += '<div class="grid2"><div class="field"><label>' + esc(t('From date')) + '</label><input class="input" type="date" value="' + toInputDate(c.from) + '" data-ch="icustom" data-w="from"></div><div class="field"><label>' + esc(t('To date')) + '</label><input class="input" type="date" value="' + toInputDate(c.to) + '" data-ch="icustom" data-w="to"></div></div>'; }
  h += '<div class="grid3">' + statBox(t('Income'), '<span class="amt pos">' + esc(Fmt.money(ti)) + '</span>') + statBox(t('Expenses'), '<span class="amt">' + esc(Fmt.money(te)) + '</span>') + statBox(t('Net'), '<span class="amt ' + (ti - te < 0 ? 'neg' : 'pos') + '">' + esc(Fmt.money(ti - te)) + '</span>') + '</div>';
  h += '<div class="card">' + Charts.dual(rows, { label: t('Cash flow') }) + '</div><div class="card pad0 list">' + rows.slice().reverse().map(r => '<div class="row"><div class="main"><div class="t">' + esc(r.l) + '</div><div class="s"><span class="pos amt">+' + esc(Fmt.num(r.a)) + '</span> · <span class="amt">-' + esc(Fmt.num(r.b)) + '</span></div></div><div class="end amt ' + (r.n < 0 ? 'neg' : 'pos') + '">' + esc(Fmt.money(r.n, null, { sign: true })) + '</div></div>').join('') + '</div></div>';
  return { title: t('Cash flow'), body: h, fab: false };
};

function fullScreen(html) { const el = $('#lock'); el.innerHTML = '<div class="full" role="dialog" aria-modal="true"><div class="inner">' + html + '</div></div>'; return el; }
const clearFull = () => { $('#lock').innerHTML = ''; };
function showPinLock() {
  return new Promise(res => {
    const meta = lsGet(CFG.pinKey); if (!meta) return res(); S.locked = true; let pin = '', fails = 0, until = 0, busy = false;
    const draw = (msg, shake) => {
      fullScreen('<div class="center" style="margin-top:8vh"><div class="logo">' + ic('lock', 'lg') + '</div><h2 style="margin-top:14px">' + esc(t('Enter your PIN')) + '</h2><div class="muted small" id="pl_msg">' + esc(msg || '') + '</div></div><div class="dots-in ' + (shake ? 'shake' : '') + '">' + Array.from({ length: meta.len }, (_, i) => '<i class="' + (i < pin.length ? 'on' : '') + '"></i>').join('') + '</div><div class="keypad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => '<button type="button" data-pk="' + n + '">' + Fmt.n(n) + '</button>').join('') + '<button type="button" data-pk="x" aria-label="' + esc(t('Forgot PIN?')) + '" style="font-size:.8rem;background:none">' + esc(t('Forgot?')) + '</button><button type="button" data-pk="0">' + Fmt.n(0) + '</button><button type="button" data-pk="b" aria-label="' + esc(t('Delete')) + '">⌫</button></div>');
      $('#lock').querySelectorAll('[data-pk]').forEach(b => b.onclick = () => press(b.dataset.pk));
    };
    const press = async k => {
      if (busy) return; if (k === 'x') { await Acts['reset-app'](); return; }
      if (Date.now() < until) { draw(t('Too many attempts. Try again in a moment.')); return; }
      if (k === 'b') pin = pin.slice(0, -1); else if (pin.length < meta.len) pin += k; draw();
      if (pin.length === meta.len) { busy = true; const h = await Crypt.hashPin(pin, b64.dec(meta.salt)); busy = false; if (h === meta.hash) { S.locked = false; clearFull(); document.removeEventListener('keydown', kd); res(); } else { fails++; pin = ''; if (fails >= 5) { until = Date.now() + 30000; fails = 0; draw(t('Too many attempts. Try again in 30 seconds.'), true); } else draw(t('Wrong PIN'), true); } }
    };
    const kd = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('b'); }; document.addEventListener('keydown', kd); draw();
  });
}

};

  formSheet({ title: t('Set a PIN'), saveLabel: t('Set PIN'), fields: [{ k: 'info', type: 'info', html: esc(t('A PIN hides the app from casual viewers on a shared screen or device. It is a convenience lock only — it does not encrypt your data and is not equivalent to bank-grade device security. For stronger protection use the encrypted vault.')) }, { k: 'pin', label: t('PIN (4–6 digits)'), pw: true, req: true, dir: 'ltr', validate: v => /^\d{4,6}$/.test(Parser.normDigits(v.pin || '')) ? '' : t('Use 4 to 6 digits.') }, { k: 'pin2', label: t('Confirm PIN'), pw: true, req: true, dir: 'ltr', validate: v => v.pin === v.pin2 ? '' : t('PINs do not match.') }], values: {},

async function unlockVault(meta) {

    const draw = (msg) => {
      fullScreen('<div class="center" style="margin-top:8vh"><div class="logo">' + ic('lock', 'lg') + '</div><h2 style="margin-top:14px">' + esc(t('Unlock your vault')) + '</h2><div class="muted small">' + esc(t('Your data is encrypted on this device.')) + '</div></div><div class="field"><label for="vp">' + esc(t('Password')) + '</label><input class="input" id="vp" type="password" autocomplete="current-password"></div><div class="errmsg" id="vp_err">' + esc(msg || '') + '</div><button class="btn block" id="vp_go">' + esc(t('Unlock')) + '</button><button class="link" id="vp_reset" style="align-self:center">' + esc(t('Forgot password? Reset the app')) + '</button>');

    async save(v) { try { const salt = crypto.getRandomValues(new Uint8Array(16)); const key = await Crypt.key(v.pw, salt, CFG.kdfIter); const chk = await Crypt.enc(key, 'mizan-vault-ok'); DB.key = key; await DB.rewriteAll(); lsSet(CFG.vaultKey, { salt: b64.enc(salt), iter: CFG.kdfIter, check: { iv: b64.enc(chk.iv), d: b64.enc(chk.d) } }); toast(change ? t('Password changed') : t('Vault enabled')); refresh(); } catch (e) { console.error(e); toast(t('Encryption failed on this browser.'), { danger: true }); return false; } } });

  fullScreen(h);
}
function obRead() { const st = S.ui.ob; const g = id => { const e = $('#' + id); return e ? e.value : undefined; }; if (g('ob_cur')) st.cur = g('ob_cur'); if (g('ob_day') !== undefined) st.day = clamp(parseInt(Parser.normDigits(g('ob_day')), 10) || 1, 1, 28); if (g('ob_sal') !== undefined) st.salAmt = g('ob_sal'); if (g('ob_sd') !== undefined) st.salDay = clamp(parseInt(Parser.normDigits(g('ob_sd')), 10) || 27, 1, 31); if (g('ob_an') !== undefined) { st.accName = g('ob_an'); st.accType = g('ob_at'); st.accBal = g('ob_ab'); st.accCard = g('ob_ac'); } }
Acts['ob-lang'] = el => { P.lang = el.dataset.k; savePrefs(); applyLang(); showOnboarding(); };
Acts['ob-next'] = () => {
  const st = S.ui.ob; obRead();
  if (st.step === 3) { const bal = st.accBal.trim() === '' ? 0 : parseMoney(st.accBal, true); const card = Parser.normDigits(st.accCard || ''); let msg = ''; if (!st.accName.trim()) msg = t('Enter an account name.'); else if (Number.isNaN(bal)) msg = t('Enter a valid amount.'); else if (card && !/^\d{4}$/.test(card)) msg = t('Enter exactly 4 digits.'); if (msg) { $('#ob_err').textContent = msg; return; } }
  st.step++; showOnboarding();
};
Acts['ob-back'] = () => { obRead(); S.ui.ob.step--; showOnboarding(); };
Acts['ob-sal'] = () => { obRead(); S.ui.ob.sal = !S.ui.ob.sal; showOnboarding(); };
function obApply(withAccount) {
  const st = S.ui.ob; S.set.currency = st.cur || S.set.currency; S.set.currencies = [S.set.currency]; S.set.startDay = st.day || 1;
  if (st.sal) { S.set.salaryOn = true; S.set.salaryAmount = parseMoney(st.salAmt) || 0; S.set.salaryDay = st.salDay || 27; }
  let a; if (withAccount && st.accName.trim()) { a = save('accounts', { id: uid(), name: st.accName.trim(), type: st.accType, currency: S.set.currency, opening: parseMoney(st.accBal || '0', true) || 0, cardEnding: Parser.normDigits(st.accCard || ''), inNetWorth: true, icon: ACCT_TYPES[st.accType][1] }); } else if (!S.d.accounts.length) a = save('accounts', { id: uid(), name: t('Cash'), type: 'cash', currency: S.set.currency, opening: 0, inNetWorth: true, icon: 'cash' });
  if (a && !S.set.defaultAccount) S.set.defaultAccount = a.id; S.set.onboarded = true; saveSettings(); S.ui.ob = null; clearFull();
}
Acts['ob-skip'] = () => { obRead(); obApply(S.ui.ob.step > 3); location.hash = '#/home'; render(false); };
Acts['ob-finish'] = el => { obApply(true); go(el.dataset.to); render(false); };
Acts['ob-demo'] = () => { obApply(true); loadDemo(); location.hash = '#/home'; render(false); };

/* =====================================================================
   BOOT
   ===================================================================== */
function fatalScreen(err) {
  console.error(err);
  fullScreen('<div class="center" style="margin-top:8vh"><div class="logo" style="background:var(--danger)">' + ic('alert', 'lg') + '</div><h2 style="margin-top:14px">' + esc(t('The app could not start')) + '</h2><p class="muted">' + esc(t('Your data has not been changed. Reload the page; if the problem continues, restore from a backup.')) + '</p></div><button class="btn block" onclick="location.reload()">' + esc(t('Reload')) + '</button>');
}
async function boot() {
  applyTheme(); applyLang(); applyPrivacy();
  try { await DB.open(); } catch (e) { console.warn('IndexedDB unavailable', e); DB.db = null; DB.memoryOnly = true; }
  try {
    const vmeta = lsGet(CFG.vaultKey, null);
    if (DB.db && (vmeta || await DB.hasEncrypted())) await unlockVault(vmeta);
    await loadAll(); ensureCategories();
  } catch (e) { fatalScreen(e); return; }
  S.ready = true;
  await showPinLock();
  if (!S.set.onboarded && !S.d.transactions.length && !S.d.accounts.length) showOnboarding();
  else { if (!S.set.onboarded) { S.set.onboarded = true; saveSettings(); } render(false); }
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (P.lockOnHide && lsGet(CFG.pinKey) && !S.locked && hiddenAt && Date.now() - hiddenAt > 10000) showPinLock();
  });
  if (!P.route) P.route = '/home';
}
boot().catch(fatalScreen);

</script>
